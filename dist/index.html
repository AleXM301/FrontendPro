<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="wrapper">
    <form id="post_form" class="form_create_post">
        <fieldset class="table_create_post">
            <legend class="form_title">New post</legend>
            <label for="title">title</label>
            <input class="title_new_post" type="text" name="title" id="title">
            <label for="body_content">body</label>
            <input class="body_new_post" type="text" name="body" id="body_content">
            <button id="btn_post_add" class="button_create_post button">Add new post</button>
        </fieldset>
    </form>
    <ul class="post_list"></ul>
</div>
<script src="./bandler.js"></script>
</body>
</html>
