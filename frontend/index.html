<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="container">
    <div class="todo-container">
        <h3 class="title">To do list</h3>
        <div class="todo_form">
            <label class="label-add">
                <input id="todo_input" type="text" placeholder="Введите" maxlength="20">
            </label>
            <button class="addBtn">
                <img src="svg/plus.svg" alt="plus icon">
            </button>
        </div>
        <ul class="todo_list"></ul>
    </div>
</div>
<script src="js/index.js" type="module"></script>
</body>
</html>
